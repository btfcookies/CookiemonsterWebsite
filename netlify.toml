[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ / 22.12+
  NODE_VERSION = "22"

# The app uses BrowserRouter, so deep links (/work, /contact) must be served
# index.html rather than 404ing on a path with no file behind it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
