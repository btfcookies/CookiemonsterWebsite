<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookiemonster | Contact</title>
    <link rel="icon" type="image/x-icon" href="pfp (1).png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <div class="site-noise"></div>
    <header class="site-header">
        <div class="nav-logo">
            <a href="index.html" class="brand">
                <img src="pfp (1).png" alt="Cookiemonster logo">
                <span>cookiemonster</span>
            </a>
        </div>
        <nav class="site-nav" aria-label="Main">
            <a href="index.html">home</a>
            <a href="about.html">about</a>
            <a href="blog.html">blog</a>
            <a class="active" href="contact.html">contact</a>
        </nav>
        <div class="nav-actions">
            <button class="theme-toggle" type="button" aria-label="Toggle Theme">
                <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="nav-burger" type="button" aria-label="Toggle menu">
                <span class="burger-bar"></span>
                <span class="burger-bar"></span>
                <span class="burger-bar"></span>
            </button>
        </div>
    </header>

    <main class="page-wrap">
        <section class="panel">
            <p class="section-label">contact</p>
            <h1 class="page-title">Let's Connect</h1>
            <p class="lede">I'm always open to discussing new game ideas, collabs, and creative opportunities.</p>
        </section>

        <section class="panel">
            <ul class="contact-list">
                <li>
                    <a href="mailto:lawrencetong1030@gmail.com">
                        <img src="gmail (1).png" alt="Gmail icon">
                        <span>lawrencetong1030@gmail.com</span>
                    </a>
                </li>
                <li>
                    <a href="https://discord.com/users/btf_cookies" target="_blank" rel="noreferrer">
                        <img src="discord-icon.svg" alt="Discord icon">
                        <span>Discord: btf_cookies</span>
                    </a>
                </li>
                <li>
                    <a href="https://github.com/btfcookies" target="_blank" rel="noreferrer">
                        <img src="Untitled design (14).png" alt="GitHub icon">
                        <span>GitHub: Cookiemonster</span>
                    </a>
                </li>
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>2026 cookiemonster. crafted with code.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.theme-toggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                    let nextTheme = 'dark';
                    if (currentTheme === 'dark') {
                        nextTheme = 'dim';
                    } else if (currentTheme === 'dim') {
                        nextTheme = 'light';
                    }
                    document.documentElement.setAttribute('data-theme', nextTheme);
                    localStorage.setItem('theme', nextTheme);
                });
            }
            
            const burgerBtn = document.querySelector('.nav-burger');
            const nav = document.querySelector('.site-header');
            if (burgerBtn && nav) {
                burgerBtn.addEventListener('click', () => {
                    nav.classList.toggle('is-menu-open');
                });
            }
        });
    </script>
</body>
</html>
